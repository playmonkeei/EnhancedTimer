<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Enhanced Timer — Make every second yours.</title>
  <desc id="desc">A mint stopwatch on a dark block grid. Stopwatch, countdown, and shared timers for Minecraft.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101e2b"/><stop offset="1" stop-color="#09121b"/></linearGradient>
    <linearGradient id="mint" x2="1" y2="1"><stop stop-color="#b1f8ba"/><stop offset="1" stop-color="#50dbc9"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#d9f3ef" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#grid)"/>
  <path d="M40 0H1240" stroke="url(#mint)" stroke-width="3"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="64" y="77" fill="#8fe9c9" font-size="13" font-weight="700" letter-spacing="3.5">YOUR WORLD. YOUR PACE.</text>
    <text x="60" y="164" fill="#f0f7fa" font-size="68" font-weight="800" letter-spacing="-2.5">Enhanced <tspan fill="#8fe9c9">Timer</tspan></text>
    <text x="64" y="212" fill="#d8e5eb" font-size="25">Make every second yours.</text>
    <text x="64" y="250" fill="#94abb9" font-size="17">A familiar Minecraft look. A timer that does more.</text>
    <g transform="translate(64 302)">
      <rect width="128" height="32" rx="16" fill="#173b36"/>
      <text x="64" y="21" text-anchor="middle" fill="#b1f8d8" font-size="12" font-weight="700" letter-spacing="1">STOPWATCH</text>
      <rect x="140" width="130" height="32" rx="16" fill="#18303d"/>
      <text x="205" y="21" text-anchor="middle" fill="#c0dae8" font-size="12" font-weight="700" letter-spacing="1">COUNTDOWN</text>
      <rect x="282" width="149" height="32" rx="16" fill="#18303d"/>
      <text x="356" y="21" text-anchor="middle" fill="#c0dae8" font-size="12" font-weight="700" letter-spacing="1">SHARED TIMERS</text>
    </g>
  </g>
  <g transform="translate(948 76)">
    <rect x="-44" y="-10" width="264" height="264" rx="44" fill="#8fe9c9" fill-opacity=".035" stroke="#8fe9c9" stroke-opacity=".1"/>
    <path d="M62 0H114V16H98V36H78V16H62Z M150 42L166 26L182 42L166 58Z" fill="url(#mint)"/>
    <path d="M42 40H134V56H150V72H166V164H150V180H134V196H42V180H26V164H10V72H26V56H42Z" fill="#142c32" stroke="url(#mint)" stroke-width="9" stroke-linejoin="round"/>
    <path d="M88 63V118L120 138" fill="none" stroke="#ebfff5" stroke-width="12" stroke-linecap="square"/>
    <path d="M88 164V174M35 118H45M132 118H142" stroke="#6cd9bc" stroke-width="6"/>
    <rect x="-2" y="217" width="180" height="44" rx="10" fill="#172e36" stroke="#33505b"/>
    <text x="88" y="247" fill="#b1f8ba" text-anchor="middle" font-family="monospace" font-size="29" font-weight="700" letter-spacing="3">00:12:34</text>
  </g>
</svg>
